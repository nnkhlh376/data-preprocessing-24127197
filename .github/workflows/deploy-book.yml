# Build Jupyter Book từ thư mục book/ và xuất bản lên GitHub Pages.
# Notebook không được chạy lại trên CI (dữ liệu thô không nằm trong repo);
# book hiển thị output đã lưu trong notebook.
name: Deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "jupyter-book==2.1.7"
      - name: Build HTML
        working-directory: book
        run: jupyter book build --html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book/_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
